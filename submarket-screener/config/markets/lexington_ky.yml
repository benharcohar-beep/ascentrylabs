geo_type: place
geo_type_reason: >
  Kentucky minor civil divisions are non-functional statistical divisions with
  no government, so they cannot issue permits or set policy. Incorporated
  Census places (Nicholasville, Georgetown, Versailles and so on) are the real
  jurisdictions. Unincorporated county land is therefore outside this screen,
  which is a genuine coverage gap and is flagged in the README.

