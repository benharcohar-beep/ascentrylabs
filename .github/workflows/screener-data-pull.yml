# Run the submarket screener in the cloud.
#
# Actions > "Submarket screener data pull" > Run workflow. Pick a market, press
# the button, wait a few minutes, download the results from the Artifacts
# section at the bottom of the run page. No Python and no terminal needed.
#
# One free key matters: CENSUS_API_KEY. Census made a key mandatory on every
# Data API request on 12 May 2026, so without it the ACS demand columns are
# blank. BLS_API_KEY and HUD_API_KEY are optional and each add a few columns.
# Everything else runs unauthenticated: Census permits, Census population
# estimates, QCEW employment, Zillow rents and the NCES district files.
#
# Add them at Settings > Secrets and variables > Actions > New repository
# secret. GitHub masks secret values in logs. Never put a key in a file in this
# repository: it is public.

name: Submarket screener data pull

on:
  workflow_dispatch:
    inputs:
      market:
        description: Which market to pull
        required: true
        default: madison_wi
        type: choice
        options: [madison_wi, grand_rapids_mi, lexington_ky, savannah_ga, all]
      mode:
        description: run = fetch and build outputs. diagnose = report what each source returns. probe = report what the ACS summary files look like.
        required: true
        default: run
        type: choice
        options: [run, diagnose, probe]
      refresh:
        description: Ignore the cache and download everything again
        required: false
        default: false
        type: boolean
      include_schools:
        description: Install geopandas so the school proxy columns load (adds about a minute)
        required: false
        default: true
        type: boolean

  # Monthly refresh, so the screen does not go stale. ACS, QCEW, ZORI and the
  # permits files all update on their own schedules through the year.
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: screener-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: submarket-screener
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: submarket-screener/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ inputs.include_schools }}" != "false" ]; then
            pip install -r requirements-optional.txt
          fi

      # The downloaded files are reused between runs. The Gazetteer and the
      # ZCTA crosswalk are national files and are the slow part, so this turns
      # a four minute run into a one minute one.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: submarket-screener/data/cache
          key: screener-cache-${{ github.run_id }}
          restore-keys: screener-cache-

      - name: Check configuration
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
        run: python -m screener.cli check || true

      - name: Diagnose
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
        run: python diagnose.py 2>&1 | tee ../diagnose-log.txt

      # Reads the layout of a published file set and prints it, so a source
      # module can be written against what is actually there rather than
      # against a guess. That is how the Building Permits reader was got right
      # after two wrong attempts. Downloads only the first kilobyte of each file.
      - name: Probe the ACS summary files
        if: ${{ inputs.mode == 'probe' }}
        run: python tools/probe_acs_summary_file.py 2>&1 | tee ../probe-log.txt

      # Not `set -e` guarded: a source that fails is a MISSING column, not a
      # failed run, and the outputs are still worth downloading. The log says
      # what failed and why.
      #
      # The condition is written as two "not"s rather than == 'run' because the
      # monthly scheduled trigger passes no inputs at all, so an equality test
      # would silently stop the schedule from ever running the screen.
      - name: Run the screen
        if: ${{ inputs.mode != 'diagnose' && inputs.mode != 'probe' }}
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
        run: |
          TARGET="--market ${{ inputs.market || 'all' }}"
          if [ "${{ inputs.market }}" = "all" ] || [ -z "${{ inputs.market }}" ]; then
            TARGET="--all"
          fi
          EXTRA=""
          if [ "${{ inputs.refresh }}" = "true" ]; then
            EXTRA="--refresh"
          fi
          python -m screener.cli run $TARGET $EXTRA 2>&1 | tee ../run-log.txt
          exit ${PIPESTATUS[0]}

      # One percentage per submarket tells you something is missing but not
      # what. This lists it column by column with the recorded reason, so the
      # run log is enough to work out what to fix next.
      - name: Column coverage
        if: ${{ always() && inputs.mode != 'probe' }}
        run: |
          TARGET="--market ${{ inputs.market }}"
          if [ "${{ inputs.market }}" = "all" ] || [ -z "${{ inputs.market }}" ]; then
            TARGET="--all"
          fi
          python -m screener.cli coverage $TARGET 2>&1 | tee ../coverage-log.txt || true
        continue-on-error: true

      - name: Collect the log
        if: always()
        run: |
          mkdir -p output
          cp ../run-log.txt output/ 2>/dev/null || true
          cp ../coverage-log.txt output/ 2>/dev/null || true
          cp ../probe-log.txt output/ 2>/dev/null || true
          # The run creates a row per shortlisted submarket in this file for
          # the manual municipal attitude column. On a cloud run it is written
          # inside the runner and thrown away with it, so nobody ever sees the
          # file they are supposed to fill in. Ship it in the artifact: fill it
          # in, commit it back to config/, and the next run scores it.
          cp config/municipal_attitude.csv output/ 2>/dev/null || true
          cp ../diagnose-log.txt output/ 2>/dev/null || true
          ls -la output || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-${{ inputs.market || 'all' }}-${{ github.run_number }}
          path: submarket-screener/output
          if-no-files-found: warn
          retention-days: 30
