name: submarket-screener tests

on:
  push:
    branches: [main]
    paths:
      - 'submarket-screener/**'
      - '.github/workflows/submarket-screener.yml'
  pull_request:
    paths:
      - 'submarket-screener/**'
      - '.github/workflows/submarket-screener.yml'

permissions:
  contents: read

concurrency:
  group: screener-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submarket-screener
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: submarket-screener/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No API keys and no network access to any data host are provided here,
      # on purpose. Every test in this suite is offline by design, so a test
      # that starts reaching the network is a bug and should fail here rather
      # than pass quietly on somebody's laptop.
      #
      # geopandas is deliberately not installed either: it lives in
      # requirements-optional.txt, and the school module is supposed to degrade
      # to MISSING without it. If that degradation ever breaks, this job catches
      # it.
      - name: Tests
        run: python -m pytest tests/ -q
